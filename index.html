function openQuizFor(i){ state.quizIdx=i; ordAttempted=false; renderQuiz(); showOv('quiz',true); }
let ordPool=[], ordSeq=[], ordDone=false, ordAttempted=false;
function renderQuiz(){
  const q=QUIZ[state.quizIdx];
  $('quiz-head').textContent='🚒 火场逃生决策 '+String(state.quizIdx+1)+' / '+QUIZ.length;
  $('quiz-q').textContent=q.q;
  const box=$('quiz-opts'); box.innerHTML='';
  $('quiz-exp').classList.remove('show'); $('quiz-exp').innerHTML='';
  $('quiz-next').style.display='none';
  if(q.type==='order'){
    ordPool=q.opts.map((_,i)=>i).sort(()=>Math.random()-0.5);
    ordSeq=[]; ordDone=false;
    box.innerHTML='<div id="ord-pool" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>'+
      '<div style="color:#8fd3ff;font-size:12px">已排顺序：</div><div id="ord-seq" style="display:flex;flex-wrap:wrap;gap:6px;min-height:38px;margin-top:4px"></div>'+
      '<button class="btn" id="ord-ok" style="margin-top:10px">确认顺序</button>';
    const renderOrd=()=>{
      const poolEl=$('ord-pool'); poolEl.innerHTML='';
      ordPool.forEach(i=>{
        const b=document.createElement('button');
        b.className='opt'; b.style.width='auto'; b.textContent=q.opts[i];
        b.onclick=()=>{ ordSeq.push(i); ordPool.splice(ordPool.indexOf(i),1); renderOrd(); };
        poolEl.appendChild(b);
      });
      const seqEl=$('ord-seq'); seqEl.innerHTML='';
      ordSeq.forEach((i,k)=>{
        const b=document.createElement('button');
        b.className='opt correct'; b.style.width='auto';
        b.textContent=(k+1)+'. '+q.opts[i];
        b.onclick=()=>{ ordPool.push(i); ordSeq.splice(k,1); renderOrd(); };
        seqEl.appendChild(b);
      });
      $('ord-ok').onclick=answerOrder;
    };
    renderOrd();
  } else {
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=String.fromCharCode(65+i)+'　'+o;
      b.onclick=()=>answerQuiz(i);
      box.appendChild(b);
    });
  }
}
function answerOrder(){
  if(ordDone) return;
  const q=QUIZ[state.quizIdx];
  if(ordSeq.length!==q.opts.length){ toast('先把所有步骤排完！'); return; }
  const ok=ordSeq.join(',')===q.order.join(',');
  if(ok){
    ordDone=true;
    const first=!ordAttempted;
    state.qDone[state.quizIdx]=true;
    if(first){ state.score+=50; state.quizCorrect++; sRight(); }
    else beep(660,.08);
    const ex=$('quiz-exp'); ex.classList.add('show');
    ex.innerHTML='<div class="ok">✓ '+q.exp.ok+(first?'　<b>+50分</b>':'　<small>（本题已无分数，记住它）</small>')+'</div><div>'+q.exp.why+'</div><div class="src">'+q.src+'</div>';
    $('quiz-next').style.display='block';
    showOv('quiz',false); startFx('ok',()=>showOv('quiz',true));
  } else {
    const first=!ordAttempted; ordAttempted=true;
    const ex=$('quiz-exp'); ex.classList.add('show');
    ex.innerHTML='<div class="no">✗ '+(first?'<b>首次排序错误：本环节不得分</b>，可重新排列':'再排一次…')+'</div><div>'+q.exp.no+'</div><div class="src">'+q.src+'</div>';
    if(first) sWrong(); else beep(300,.06);
    showOv('quiz',false); startFx('bad',()=>{ showOv('quiz',true); renderQuiz(); });
  }
}
function answerQuiz(i){
  const q=QUIZ[state.quizIdx];
  const opts=Array.from(document.querySelectorAll('#quiz-opts .opt'));
  if(opts[0].dataset.done) return;
  const first=!opts[0].dataset.attempted;
  if(i===q.ans){
    opts.forEach((o,idx)=>{ o.onclick=null; if(idx===i)o.classList.add('correct'); });
    opts[0].dataset.done='1';
    state.qDone[state.quizIdx]=true;
    if(first){ state.score+=50; state.quizCorrect++; sRight(); }
    else beep(660,.08);
    const ex=$('quiz-exp'); ex.classList.add('show');
    ex.innerHTML='<div class="ok">✓ '+q.exp.ok+(first?'　<b>+50分</b>':'　<small>（本题已无分数，记住它）</small>')+'</div><div>'+q.exp.why+'</div><div class="src">'+q.src+'</div>';
    $('quiz-next').style.display='block';
    showOv('quiz',false); startFx('ok',()=>showOv('quiz',true));
  } else {
    opts[0].dataset.attempted='1';
    opts[i].classList.add('wrong'); opts[i].onclick=null;
    const ex=$('quiz-exp'); ex.classList.add('show');
    ex.innerHTML='<div class="no">✗ '+(first?'<b>首次选择错误：本环节不得分</b>，可重新选择':'再想想…')+'</div><div>'+q.exp.no+'</div><div class="src">'+q.src+'</div>';
    if(first) sWrong(); else beep(300,.06);
    showOv('quiz',false); startFx('bad',()=>showOv('quiz',true));
  }
}

function enterCorridor(){

  state.scene='corridor'; map=CORR.slice(); state.px=0; state.py=9;
  state.corT=90; smokeSlow=0; evCur=null;

  },1000);
  /* 随机坠落事件：警告→坠落→清除 */

    if(!evCur){
      const cand=EV_SPOTS.filter(s=>map[s.y][s.x]==='.' && !(s.x===state.px&&s.y===state.py));
      if(cand.length&&Math.random()<0.7){ evCur={x:cand[0].x,y:cand[0].y,phase:'warn',t:0}; map[evCur.y]=map[evCur.y].slice(0,evCur.x)+'!'+map[evCur.y].slice(evCur.x+1); }

/* ================= 评委演示模式 ================= */
let demoRun=false, demoQueue=[], demoIdx=0, demoTimer=null, demoPending=false;
function bfsPath(sx,sy,tx,ty){
  if(sx===tx&&sy===ty) return [];
  const BLOCK='#BDNTKCFERAVZOMJQG&~⌁';
  const doorSet={'29,8':1,'29,9':1,'29,10':1};
  const q=[[sx,sy]], prev={}, seen={[sx+','+sy]:true};
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    const c=q.shift();
    for(const d of dirs){
      const nx=c[0]+d[0], ny=c[1]+d[1];
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
      const k=nx+','+ny;
      if(seen[k]) continue;
      if(doorSet[k]) continue;
      if(BLOCK.includes(map[ny][nx])) continue;
      seen[k]=true; prev[k]=c;
      if(nx===tx&&ny===ty){
        const path=[]; let cur=[nx,ny];
        while(!(cur[0]===sx&&cur[1]===sy)){ path.unshift({x:cur[0],y:cur[1]}); cur=prev[cur[0]+','+cur[1]]; }
        return path;
      }
      q.push([nx,ny]);
    }
  }
  return null;
}
function demoWalk(tx,ty,cb){
  const path=bfsPath(Math.round(state.px),Math.round(state.py),tx,ty);
  if(!path){ state.px=tx; state.py=ty; if(cb)cb(); return; }
  demoPending=true;
  let i=0;
  const iv=setInterval(()=>{
    if(!demoRun){ clearInterval(iv); demoPending=false; return; }
    if(overlayOpen()) return;
    const s=path[i];
    state.px=s.x; state.py=s.y; state.moving=true;
    i++;
    if(i>=path.length){
      clearInterval(iv); demoPending=false;
      if(map[s.y][s.x]==='?'){
        const ni=NODES.findIndex(n=>n.x===s.x&&n.y===s.y);
        if(ni>=0&&!state.qDone[ni]) openQuizFor(ni);
      }
      if(cb)cb();
    }
  },110);
}

  demoQueue.push({sub:'逃生成功！',wait:800,fn:()=>{ keys.right=false; if(!$('dialog').classList.contains('show')) return false; $('dlg-ok').click(); return true; }});
  demoQueue.push({sub:'演示结束——亲自挑战试试？',wait:800,fn:()=>{ demoFinished(); return true; }});
}
function demoTick(){
  if(!demoRun) return;
  clearTimeout(demoTimer);
  if(demoPending){ demoTimer=setTimeout(demoTick,100); return; }
  if(demoIdx>=demoQueue.length){ demoFinished(); return; }
  const item=demoQueue[demoIdx];
  if(item.sub) $('demo-sub').textContent='🎬 '+item.sub;
  let ready=true;
  try{ if(item.fn) ready=item.fn()!==false; }catch(e){}
  if(!ready){ demoTimer=setTimeout(demoTick,150); return; }
  demoIdx++;
  demoTimer=setTimeout(demoTick,item.wait||650);
}

function drawRoute(){
  const cv=$('route-cv'); if(!cv) return;
  const c=cv.getContext('2d'); c.imageSmoothingEnabled=false;
  c.clearRect(0,0,460,74);
  const t=animT-(+cv.dataset.t0||0);
  const GOOD=['断电·报警','判烟低姿','手背试门温','安全通道','室外集合'];
  const BAD=['乘电梯 ✗','跳窗 ✗','躲衣柜 ✗'];
  const stepT=30;
  GOOD.forEach((g,i)=>{
    const on=t>=i*stepT;
    const x=6+i*88;
    c.fillStyle=on?'#0e2e1c':'#101a38'; c.strokeStyle=on?'#3ddc84':'#33406a'; c.strokeRect(x,6,80,26);
    c.fillStyle=on?'#3ddc84':'#5a6478'; c.font='11px sans-serif'; c.textAlign='center';
    c.fillText((on?'✓ ':'')+g,x+40,23);
  });
  if(t<GOOD.length*stepT){
    const px=10+(t/stepT)*88, py=40;
    c.fillStyle='#ffd166'; c.fillRect(px,py,5,5);
  } else {
    const bt=t-GOOD.length*stepT;
    BAD.forEach((b,i)=>{
      const on=bt>=i*20;
      const x=6+i*150;
      c.fillStyle=on?'#3a1414':'#101a38'; c.strokeStyle=on?'#ff5f5f':'#33406a'; c.strokeRect(x,44,140,24);
      c.fillStyle=on?'#ff8c8c':'#5a6478'; c.font='11px sans-serif'; c.textAlign='center';
      c.fillText(b,x+70,59);
    });
  }
}

/* 移动（网格步进，复古手感） */
setInterval(()=>{
  if(overlayOpen()) return;
  if(smokeSlow>0){ smokeSlow--; return; }
  let dx=0,dy=0;
  if(keys.left)dx=-1; else if(keys.right)dx=1;
  if(dx===0){ if(keys.up)dy=-1; else if(keys.down)dy=1; }   // 轴互斥：禁止斜走
  if(dx===0&&dy===0){ state.moving=false; return; }
  state.moving=true; state.dir= dx!==0?(dx>0?2:1):(dy>0?0:3);
  const nx=state.px+dx, ny=state.py+dy;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;
  const nch=map[ny][nx];
  if(SOLID.includes(nch)){
    if(nch==='~') toast('🔥 火墙挡路！先完成逃生决策让它熄灭');
    return;
  }
  if(isDoorTile(nx,ny)){ state.px=nx; state.py=ny; doorChoice(DOORS.find(d=>d.x===nx&&d.y===ny)); return; }
  if(nch==='⌁'){
    if(state.items.includes('ext')){
      state.items.splice(state.items.indexOf('ext'),1);
      map[ny]=map[ny].slice(0,nx)+'.'+map[ny].slice(nx+1);
      state.px=nx; state.py=ny; sRight();
      toast('🧯 灭火器扑灭了火苗，抄近路成功！');
    } else toast('🔥 小火苗挡路——去捡灭火器（🧯）！');
    return;
  }
  if(state.scene==='dorm'&&nx>=28&&ny>=7&&ny<=9){ toast('宿舍门现在不用打开，先排查隐患！'); return; }
  state.px=nx; state.py=ny;
  if(nch==='%'){
    if(state.items.includes('mask')){ toast('😷 防烟面罩护你穿过浓烟'); }
    else if(state.items.includes('towel')){ state.items.splice(state.items.indexOf('towel'),1); toast('🧻 湿毛巾帮你挡了一次浓烟！'); }
    else smokeSlow=1;
  }
  if(nch==='?'){
    const ni=NODES.findIndex(n=>n.x===nx&&n.y===ny);
    if(ni>=0&&!state.qDone[ni]) openQuizFor(ni);
  }
  const it=ITEMS.find(o=>o.x===nx&&o.y===ny);
  if(it&&!state.items.includes(it.k)){
    state.items.push(it.k);
    map[ny]=map[ny].slice(0,nx)+'.'+map[ny].slice(nx+1);
    toast('🎒 获得道具：'+it.name); beep(880,.07); setTimeout(()=>beep(1318,.09),80);

},135);

      R(7,0,2,3,'#ffd166'); R(8,1,1,2,'#ff8c42'); R(5,11,6,2,'#aeb9bf'); R(5,13,6,2,'#8a909e');
      break;
    case 'Y': // 纸堆
      R(2,5,12,10,'#f2efe6'); R(2,5,12,2,'#ffffff'); R(2,8,12,1,'#d9d2c0'); R(2,12,12,1,'#d9d2c0');
      R(2,6,8,1,'#d9d2c0'); R(2,10,6,1,'#d9d2c0');
      break;
    case 'V': // 水槽
      R(2,3,12,11,'#eef2f6'); R(2,3,12,2,'#ffffff'); R(3,5,10,7,'#8fd3ff'); R(5,7,6,1,'#b8e2f7');
      R(12,0,2,4,'#aeb9bf'); R(12,4,3,2,'#aeb9bf'); R(12,6,1,2,'#8fd3ff'); R(4,13,8,1,'#9fd3f2');
      break;
    case 'Z': // 气瓶
      R(5,1,6,13,'#4a90d9'); R(5,1,6,2,'#8fc3ef'); R(6,4,4,6,'#3a7abf'); R(7,5,2,2,'#ffd166');
      R(4,0,8,2,'#aeb9bf'); R(6,14,4,2,'#2b5a8f');
      break;
    case 'O': // 烘箱（运行中）
      R(1,2,14,12,'#8a909e'); R(1,2,14,1,'#aeb9bf'); R(3,4,7,6,'#3a3f52'); R(4,5,5,1,'#ff8c42');
      R(3,3,2,2,'#ff5252'); R(11,7,2,5,'#5a6478'); R(2,14,12,2,'#6d7488');
      break;
    case 'M': // 多媒体讲台
      R(0,0,16,16,'#2b3348'); R(0,0,16,1,'#3d4568'); R(2,2,12,6,'#3f7fbf'); R(3,3,10,1,'#7fb4d9');
      R(2,9,12,2,'#3d4458'); R(3,10,3,1,'#ffd166'); R(7,10,3,1,'#3ddc84');
      R(2,12,12,3,'#232a3c'); R(3,12,2,2,'#cfd8dc');
      break;
    case 'J': // 饮水机
      R(3,1,10,13,'#eef2f6'); R(3,1,10,1,'#ffffff'); R(4,4,8,3,'#8fd3ff'); R(4,4,8,1,'#b8e2f7');
      R(5,8,2,2,'#8fd3ff'); R(9,8,2,2,'#ff5252'); R(6,9,2,2,'#ff5252');
      R(3,13,10,2,'#aeb9bf'); R(4,15,8,1,'#5a6478');
      break;
    case 'Q': // 空调
      R(1,2,14,8,'#eef2f6'); R(1,2,14,1,'#ffffff'); R(2,4,12,1,'#aeb9bf'); R(2,6,12,1,'#aeb9bf'); R(2,8,12,1,'#aeb9bf');
      R(12,9,2,2,'#3ddc84');
      break;
    case 'G': // 黑板
      R(0,0,16,16,'#2f5e3f'); R(0,0,16,1,'#3d7a52'); R(0,15,16,1,'#8a5a33');
      R(2,5,8,1,'#e8e2d0'); R(6,8,10,1,'#e8e2d0'); R(4,11,7,1,'#e8e2d0');
      break;
    case '~': // 火墙（动画）
      { const f2=((animT/8|0)+(x+y))%2;
        R(2,f2?1:2,12,14,'#3a1414'); R(1,14,14,2,'#2b0a0a');
        R(4,3+f2,8,8,'#e63946'); R(6,5+f2,4,5,'#ff8c42'); R(7,7+f2,2,3,'#ffe066');
        R(3,2+f2,2,3,'#ff8c42'); R(11,4+f2,2,3,'#ff8c42'); }
      break;
    case '%': // 浓烟（缓慢飘动）
      { const f2=((animT/10|0)+x+y)%3;
        R(3,6-f2,10,7,'#7d8291'); R(5,4-f2,6,4,'#989dad'); R(6,3-f2,4,2,'#b3b8c4'); }
      break;
    case '&': // 断梁残骸
      R(2,9,12,5,'#4a3a2f'); R(2,9,12,1,'#5d4430'); R(3,12,6,2,'#33302a'); R(11,11,3,3,'#3a2f26');
      break;
    case '?': // 答题节点
      { const pu=((animT/16|0)+x+y)%2;
        R(1,1,14,14,'#1b2440'); R(1,1,14,1,'#33406a'); R(1,14,14,1,'#33406a');
        ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillStyle=pu?'#ffd166':'#ffe9ad';
        ctx.fillText('?',px+8,py+12); }
      break;
    case 't': // 湿毛巾
      R(2,5,12,10,'#4a90d9'); R(2,5,12,2,'#6fb0ef'); R(2,9,12,1,'#3a7abf'); R(5,7,6,1,'#eaf6ff');
      break;
    case 'm': // 防烟面罩
      R(4,4,8,7,'#f2efe6'); R(4,4,8,1,'#ffffff'); R(6,6,4,2,'#8fd3ff'); R(3,9,2,1,'#e8e2d0'); R(11,9,2,1,'#e8e2d0');
      break;
    case 'f': // 灭火器
      R(5,1,6,13,'#e63946'); R(5,1,6,2,'#ff8c42'); R(7,5,2,3,'#ffe066'); R(5,14,6,2,'#33302a'); R(8,0,1,2,'#2b2b33');
      break;
    case '⌁': // 小火苗（可用灭火器扑灭）
      { const f2=((animT/6|0)+x+y)%2;
        R(6,2+f2,4,11,'#3a1414'); R(6,5+f2,4,5,'#ff8c42'); R(7,7+f2,2,3,'#ffe066'); R(5,13,6,2,'#2b0a0a'); }
      break;
    case '!': // 坠落预警
      { const pu=((animT/10|0)+x)%2;
        R(0,0,16,16,pu?'rgba(255,95,95,.28)':'rgba(255,95,95,.12)');
        ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillStyle=pu?'#ff5f5f':'#ff8c8c';
        ctx.fillText('!',px+8,py+12); }
      break;
    default: R(0,0,16,16,'#0a0d1a');
  }
}
function drawCheck(x,y){ const px=x*TILE,py=y*TILE; ctx.strokeStyle='#3ddc84'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px+4,py+8); ctx.lineTo(px+7,py+11); ctx.lineTo(px+12,py+4); ctx.stroke(); }
function drawCross(x,y){ const px=x*TILE,py=y*TILE; ctx.strokeStyle='#ff5f5f'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px+4,py+4); ctx.lineTo(px+12,py+12); ctx.moveTo(px+12,py+4); ctx.lineTo(px+4,py+12); ctx.stroke(); }
function drawMark(x,y){ const px=x*TILE, py=y*TILE-3+Math.round(Math.sin(animT/14)*2); ctx.fillStyle='#ffd166'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText('?',px+8,py+12); }
/* 靠近隐患时头顶提示 */
function drawPrompt(){
  if(!SCENES[state.scene]||overlayOpen()) return;
  const h=curHazards.find(hz=>!state.found.includes(hz.id) && Math.abs(hz.x-state.px)+Math.abs(hz.y-state.py)<=1);
  if(!h) return;
  const x=state.px*TILE+8, y=state.py*TILE-7;
  ctx.font='10px sans-serif'; ctx.textAlign='center';
  const label=h.name+'，按E调查';
  const w=ctx.measureText(label).width+10;
  ctx.fillStyle='rgba(8,12,26,.9)'; ctx.fillRect(x-w/2,y-13,w,13);
  ctx.fillStyle='#ffd166'; ctx.fillText(label,x,y-2);
}
/* ============ 答题过场动画 ============ */
function startFx(kind, cb){
  const tok=++fxToken;
  state.fx={kind:kind,t:0};
  fxP=[];
  const col= kind==='ok'?['#3ddc84','#ffe066','#8fd3ff','#ffffff']:['#ff5f5f','#ff8c42','#e63946','#ffd166'];
  for(let i=0;i<42;i++){
    fxP.push({x:240,y:150,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*9-2,life:45+Math.random()*25,c:col[i%col.length],s:1+Math.random()*2});
  }
  setTimeout(()=>{ if(fxToken!==tok) return; state.fx=null; if(cb)cb(); }, kind==='ok'?1050:850);
}
function drawFx(){
  if(!state.fx) return;
  const f=state.fx;
  ctx.fillStyle='rgba(6,8,18,.55)'; ctx.fillRect(0,0,480,320);
  const p=Math.min(f.t/9,1);
  const sc=1+(1-p)*0.6;
  ctx.save(); ctx.translate(240,142); ctx.scale(sc,sc);
  ctx.textAlign='center'; ctx.font='bold 90px sans-serif';
  ctx.fillStyle=f.kind==='ok'?'#3ddc84':'#ff5f5f';
  ctx.fillText(f.kind==='ok'?'✓':'✗',0,28); ctx.restore();
  ctx.font='13px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle=f.kind==='ok'?'#c9f7e0':'#ffd0d0';
  ctx.fillText(f.kind==='ok'?'逃生选择正确！':'危险！',240,196);
  fxP.forEach(pt=>{
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.16; pt.life--;
    ctx.globalAlpha=Math.max(Math.min(pt.life/55,1),0);
    ctx.fillStyle=pt.c; ctx.fillRect(pt.x-pt.s,pt.y-pt.s,pt.s*2,pt.s*2);
  });
  ctx.globalAlpha=1;
  state.fx.t++;
}
function drawPlayer(){
  const rows=SPRITES[state.gender], pal=state.gender==='male'?PAL:PAL_F;
  const bob=state.moving?(Math.floor(animT/7)%2?1:0):0;
  const blink=(animT%200)<8;
  const ox=state.px*TILE, oy=state.py*TILE-(rows.length-16)+bob;
  for(let y=0;y<rows.length;y++){ const row=rows[y]; for(let x=0;x<row.length;x++){ const ch=row[x]; if(ch==='.')continue; const xx=state.dir===1?(row.length-1-x):x; let col=pal[ch]; if(ch==='P'&&blink) col=pal['W']; ctx.fillStyle=col||'#fff'; ctx.fillRect(ox+xx,oy+y,1,1); } }
}
/* 火场火星飘落 */
function drawEmbers(){
  for(let i=0;i<12;i++){
    const ex=(i*53+animT*2)%480, ey=(animT*3+i*67)%320;
    ctx.globalAlpha=0.45+0.3*Math.sin(animT/8+i);
    ctx.fillStyle='#ff8c42'; ctx.fillRect(ex,ey,3,5);
    ctx.fillStyle='#ffe066'; ctx.fillRect(ex,ey,1,2);
  }
  ctx.globalAlpha=1;
}
function drawDoorLabels(){
  ctx.font='11px sans-serif'; ctx.textAlign='right';
  ctx.fillStyle='#8fd3ff';
  ctx.fillText('电梯',23*TILE+8,8*TILE-4);
  ctx.fillText('窗台',23*TILE+8,9*TILE-4);
  const ga=0.25+0.2*Math.sin(animT/10);
  ctx.fillStyle='rgba(61,220,132,'+ga.toFixed(2)+')';
  ctx.fillRect(19*TILE,10*TILE-12,6*TILE,11);
  ctx.fillStyle='#3ddc84';
  ctx.fillText('安全出口',23*TILE+8,10*TILE-4);
  DOORS.forEach(d=>{ ctx.fillStyle='#7a5a3a'; ctx.fillRect(d.x*TILE,d.y*TILE,2,16); });
}
function drawHUD(){
  ctx.fillStyle='rgba(8,12,26,.85)'; ctx.fillRect(0,0,480,22);
  ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#cfe0ff';
  ctx.fillText(state.scene==='corridor'?'🚪 火场逃生 · 选出口':SCENES[state.scene].name,6,15);
  ctx.textAlign='center';
  if(SCENES[state.scene]){ ctx.fillStyle='#ffd166'; ctx.fillText('隐患 '+state.sceneFound+'/'+curHazards.length,240,15); }
  if(state.scene==='corridor'){
    ctx.fillStyle=state.corT<=20?'#ff5f5f':'#ff8c42';
    ctx.fillText('⏱ '+state.corT+'s',160,15);
    ctx.fillStyle='#ffd166';
    ctx.fillText('决策 '+state.qDone.filter(Boolean).length+'/'+QUIZ.length,250,15);
    ctx.textAlign='left';
    ctx.fillStyle='#9fb4d8';
    ctx.fillText('🎒 '+(state.items.length?state.items.map(k=>ITEM_ICON[k]).join(''):'无'),6,40);
    ctx.textAlign='center';
  }
  if(state.mode==='hard'&&SCENES[state.scene]){ const s=String(state.timeLeft%60).padStart(2,'0'); ctx.fillStyle=state.timeLeft<=60?'#ff5f5f':'#ffd166'; ctx.fillText('⏱ '+Math.floor(state.timeLeft/60)+':'+s,180,15); }
  ctx.textAlign='right'; ctx.fillStyle='#3ddc84'; ctx.fillText('得分 '+state.score,474,15);
}
function draw(){
  ctx.clearRect(0,0,480,320);
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) drawTile(x,y,map[y][x]);
  if(state.scene==='corridor'){ drawFireGlow(); }
  if(state.scene==='dorm'){ drawLightShaft(); }
  drawVignette();
  if(state.scene==='corridor') drawDoorLabels();
  if(SCENES[state.scene]){
    curHazards.forEach(h=>{ if(state.found.includes(h.id)) drawCheck(h.x,h.y); });
    drawPrompt();
  } else {
    DOORS.forEach(d=>{ if(d.failed) drawCross(d.x,d.y); });
    NODES.forEach((n,i)=>{ if(state.qDone[i]) drawCheck(n.x,n.y); });
    drawEmbers();
  }
  drawPlayer(); drawHUD();
  if(state.fx) drawFx();
  if(state.fade.a>0){ ctx.fillStyle='rgba(4,6,14,'+state.fade.a.toFixed(2)+')'; ctx.fillRect(0,0,480,320); }
}
/* 火墙辉光 / 窗光 / 暗角 */
function drawFireGlow(){
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const ch=map[y][x];
    if(ch==='~'||ch==='⌁'){
      ctx.globalAlpha=0.06+0.04*Math.sin(animT/5+x+y);
      ctx.fillStyle='#ff8c42';
      ctx.fillRect(x*TILE-10,y*TILE-10,36,36);
    }
  }
  ctx.globalAlpha=1;
}
function drawLightShaft(){
  ctx.globalAlpha=0.06; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.moveTo(56,0); ctx.lineTo(152,0); ctx.lineTo(240,320); ctx.lineTo(96,320); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
}
const vGrad=ctx.createRadialGradient(240,160,110,240,160,330);
vGrad.addColorStop(0,'rgba(0,0,0,0)'); vGrad.addColorStop(1,'rgba(0,0,0,.30)');
function drawVignette(){ ctx.fillStyle=vGrad; ctx.fillRect(0,0,480,320); }
function loop(){
  animT++;
  if(state.fade.dir!==0){
    state.fade.a=Math.min(1,Math.max(0,state.fade.a+state.fade.dir*0.08));
    if(state.fade.a>=1&&state.fade.dir===1){ state.fade.dir=0; const cb=state.fade.cb; state.fade.cb=null; if(cb)cb(); }
    if(state.fade.a<=0&&state.fade.dir===-1){ state.fade.dir=0; }
  }
  draw(); 
  if($('result').classList.contains('show')) drawRoute();
  if($('case').classList.contains('show')) drawCase();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
draw();
</script>
</body>
